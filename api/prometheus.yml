global:
  scrape_interval: 5s
scrape_configs:
  - job_name: payment
    static_configs:
      - targets: ['payment_service:8000']
  - job_name: driver
    static_configs:
      - targets: ['driver_service:8000']
  - job_name: ride
    static_configs:
      - targets: ['ride_service:8000']
  - job_name: taxi_api
    static_configs:
      - targets: ['taxi_api:8000']
  - job_name: outbox_api_driver
    static_configs:
      - targets: ['outbox_api_driver:8001']
  - job_name: outbox_api_order
    static_configs:
      - targets: ['outbox_api_taxi:8002']
  - job_name: outbox_api_ride
    static_configs:
      - targets: ['outbox_api_ride:8003']