version: '3.9'

services:
  taxi_api:
    build: ./taxi_api
    env_file: .env
    ports:
      - "8080:8000"
    environment:
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      REDIS_HOST: ${REDIS_HOST}
    depends_on:
      db_api:
        condition: service_healthy
      redis_api:
        condition: service_healthy
      rabbitmq_api:
        condition: service_started
    restart: always
  
  ride_service:
    build: ./ride_service
    env_file: .env
    ports:
      - "8090:8000"
    environment:
      DB_HOST: "${DB_HOST}" 
      DB_PORT: "${DB_PORT}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB:  "${POSTGRES_DB}"
      REDIS_HOST: redis_api
      RABBITMQ_HOST: ${RABBITMQ_HOST}
    depends_on:
      db_api:
        condition: service_healthy
      rabbitmq_api:
        condition: service_started
      redis_api:
        condition: service_healthy
    restart: always
    
  db_api:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}" 
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      timeout: 5s
  
  redis_api:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  rabbitmq_api:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
  
  outbox_api:
    build: ./taxi_api
    env_file: .env
    command: python outbox_relay.py
    environment:
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      RABBITMQ_HOST: ${RABBITMQ_HOST}
    depends_on:
      db_api:
        condition: service_healthy
      rabbitmq_api:
        condition: service_started
    restart: always

volumes:
  db_data:
  redis_data:
  db_ride_data:
  rabbitmq_data:
