version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8080:8000"
    depends_on:
      - db
    restart: always
    
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-app_db}" 
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
